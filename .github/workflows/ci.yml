name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type
        run: mypy services data
      - name: Tests
        run: pytest -v --cov --cov-report=term-missing
      - name: Docker build
        run: |
          docker build -f Dockerfiles/thumbnail.Dockerfile -t frameops-thumbnail:${{ github.sha }} .
          docker build -f Dockerfiles/metadata.Dockerfile -t frameops-metadata:${{ github.sha }} .
          docker build -f Dockerfiles/transcode.Dockerfile -t frameops-transcode:${{ github.sha }} .

  terraform:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - name: Terraform fmt
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Terraform validate (dev)
        run: |
          cd infrastructure/terraform/environments/dev/ap-south-1
          terraform init -backend=false
          terraform validate
      - name: Terraform plan (dev)
        if: github.event_name == 'pull_request'
        run: |
          cd infrastructure/terraform/environments/dev/ap-south-1
          terraform plan -no-color
      - name: Security scan
        uses: aquasecurity/tfsec-action@v1
        with:
          soft_fail: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, terraform]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Manual approval required
        run: echo "Production apply requires manual approval per Spec 36"
